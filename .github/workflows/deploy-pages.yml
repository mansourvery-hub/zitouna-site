name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow

      # The demo is generated from the app, so CI regenerates it rather than
      # trusting a committed copy: the Flutter build is 26MB and must never go
      # stale against the app it is a screenshot of.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: pnpm install --frozen-lockfile

      # TODO: needs the app repo URL. It is a variable rather than a literal so
      # the fork-safe default works without editing this file; set APP_REPO in the
      # repository settings to "owner/name" of the Flutter app.
      - name: Generate the demo from the app
        env:
          ZITOUNA_APP_DIR: ${{ github.workspace }}/../app
        run: |
          if [ -z "${{ vars.APP_REPO }}" ]; then
            echo "::error::repository variable APP_REPO is not set (owner/name of the Flutter app repo)"
            exit 1
          fi
          git clone --depth 1 --branch web-target-experiment \
            "https://github.com/${{ vars.APP_REPO }}.git" ../app
          sh tools/build-demo.sh --app ../app

      - name: Build site
        run: python3 build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4