name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # The app repo is private, so regenerating the demo in CI needs a read-only
  # token. Without one, the build committed under src/flutter-demo is deployed
  # as-is -- still the real app, just captured by whoever last ran
  # tools/build-demo.sh locally. Set the APP_TOKEN secret to a read-only PAT to
  # make CI the source of truth. Compared as an env var rather than
  # `secrets.APP_TOKEN` directly, which is not usable in a step-level `if`.
  HAS_APP_TOKEN: ${{ secrets.APP_TOKEN != '' }}

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: subosito/flutter-action@v2
        if: env.HAS_APP_TOKEN == 'true'
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - run: pnpm install --frozen-lockfile

      - name: Generate the demo from the app
        if: env.HAS_APP_TOKEN == 'true'
        env:
          ZITOUNA_APP_DIR: ${{ github.workspace }}/../app
        run: |
          git clone --depth 1 --branch web-target-experiment \
            "https://x-access-token:${{ secrets.APP_TOKEN }}@github.com/${{ vars.APP_REPO }}.git" ../app
          # Drift's generated code is gitignored, so a fresh clone has no
          # app_database.g.dart and the build cannot resolve the tables. Codegen
          # has to run before build_demo, exactly as it does locally.
          ( cd ../app && flutter pub get && dart run build_runner build --delete-conflicting-outputs )
          sh tools/build-demo.sh --app ../app

      - name: Build site
        run: python3 build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4