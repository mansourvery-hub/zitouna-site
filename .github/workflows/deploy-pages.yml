name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Only needed when regenerating the demo from the app (see below).
      - uses: subosito/flutter-action@v2
        if: ${{ secrets.APP_TOKEN != '' }}
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - run: pnpm install --frozen-lockfile

      # The app repo is private, so regenerating the demo in CI needs a read-only
      # token. Without one, the build committed under src/flutter-demo is used
      # as-is -- still the real app, just captured by whoever last ran
      # tools/build-demo.sh locally. Set the APP_TOKEN secret to a read-only PAT
      # to make CI the source of truth.
      - name: Generate the demo from the app
        if: ${{ secrets.APP_TOKEN != '' }}
        env:
          ZITOUNA_APP_DIR: ${{ github.workspace }}/../app
        run: |
          git clone --depth 1 --branch web-target-experiment \
            "https://x-access-token:${{ secrets.APP_TOKEN }}@github.com/${{ vars.APP_REPO }}.git" ../app
          sh tools/build-demo.sh --app ../app

      - name: Build site
        run: python3 build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4